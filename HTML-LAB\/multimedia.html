<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <h1>HTML Multimedia</h1>
    <section>
        <h2>Image</h2>
        <a href="https://www.google.com">
            <img
                src="images/image.png"
                alt="Profile photo"
                width="200"
                height="200">
        </a>
    </section>

    <section>
        <h2>Audio</h2>
        <p>Use the audio controls to play or pause this sample sound.</p>
        <audio controls>
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>

    <section>
        <h2>Video</h2>
        <p>Use the video controls to play or pause this sample clip.</p>
        <video controls width="480">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
    </section>

    <section>
        <h2>Embedded HTML Tutorial</h2>
        <iframe
            width="560"
            height="315"
            src="https://www.youtube-nocookie.com/embed/UB1O30fR-EE"
            title="HTML Crash Course for Beginners"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </section>
</body>
</html>
