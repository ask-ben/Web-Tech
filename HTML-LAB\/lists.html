<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Unordered List</h1>
    <h2>Inventory</h2>
    <ul>
        <li>Cocoa</li>
        <li>Tea</li>
        <li>Bread</li>
        <li>Coffee</li>
        <li>TV</li>
    </ul>
    <h1>Ordered list</h1>
    <h2>Ordinal Numbers</h2>
    <ol>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
        <li>Fourth</li>
        <li>Fifth</li>
    </ol>

<hr>
<h1>Nested Lists:</h1>
<hr>

    <ul>
 <li>Fruits
   <ul>
     <li>Apple</li>
     <li>Banana</li>
     <li>Orange</li>
   </ul>
 </li>
 <li>Vegetables
   <ul>
     <li>Carrot</li>
     <li>Broccoli</li>
     <li>Spinach</li>
   </ul>
 </li>
</ul>

</body>
</html>
