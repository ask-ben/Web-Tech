<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory 4: The CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Content</h2>
        <p>The content box holds the text and images of the element.</p>
    </div>

    <div class="card">
        <h2>Padding</h2>
        <p>Padding is the space inside the border, between content and border.</p>
    </div>

    <div class="card">
        <h2>Margin</h2>
        <p>Margin is the space outside the border, separating this card from others.</p>
    </div>
</body>
</html>
