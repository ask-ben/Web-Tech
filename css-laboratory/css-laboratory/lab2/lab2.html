<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory 2: CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="page-title">Element, Class, and ID Selectors</h1>

    <h2>Cards</h2>
    <h3>Each card uses the same class</h3>

    <div class="card">
        <p>This card is styled by the .card class and the .card p descendant selector.</p>
    </div>

    <div class="card">
        <p class="highlight">This paragraph also has its own class, so its color is different.</p>
    </div>

    <div class="card">
        <p>Classes can be reused many times; an ID can appear only once per page.</p>
    </div>
</body>
</html>
